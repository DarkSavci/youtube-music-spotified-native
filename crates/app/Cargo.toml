[package]
name = "spotified"
description = "Youtube Music Spotified, native"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# The whole UI. glow keeps the binary and the dependency tree small; wgpu is
# not needed for a 2D music client. default_fonts supplies the emoji fallback
# behind Inter.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
# Rasterises the SVG icons at the size they are drawn.
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
# Decodes artwork and Winamp skins, and encodes the --screenshot PNG.
# BMP is what a Winamp skin's sheets are.
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
# Inflates the entries of a Winamp skin, which is a zip. The PNG decoder
# already brings it in.
flate2 = "1"
# Fetches artwork. TLS is the system's own (schannel on Windows), which
# needs no C crypto library.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
spotified-client = { path = "../client" }
spotified-audio = { path = "../audio" }
# Media keys and the system's now-playing card. On Linux that is MPRIS, over
# a D-Bus written in Rust rather than libdbus.
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
# The window's native handle, which the media controls attach to.
raw-window-handle = "0.6"
# The notification-area icon and its menu.
tray-icon = { version = "0.26", default-features = false }
# WebSockets: the DevTools protocol to a browser on this computer, to read
# the cookies of a sign-in, and a Listen Together relay over the system's
# TLS.
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "native-tls"] }
# Maps the file MilkDrop's process is given the sound through. The font
# loader already builds it.
memmap2 = "0.9"
# Finds libprojectM's functions when MilkDrop's window is first opened.
libloading = "0.8"
# Backend-to-UI events. The standard channel has no select, which the worker
# pools need.
crossbeam-channel = "0.5"
# Roaming and local application data directories.
directories = "6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# How far this computer's clock is from UTC, for the times a Listen Together
# room shows (when it expires, when things happened). The standard library
# has no way to ask.
time = { version = "0.3", default-features = false, features = ["std", "local-offset"] }
# Checks a downloaded update against the checksum its release states.
sha2 = "0.10"
# The patterns that keep cookies, signed addresses and e-mail addresses out
# of the log and of a problem report. They are the Electron app's own nine,
# and matching them by hand would be the place a secret slipped through.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }

# MilkDrop's window is this program started again, with an event loop and
# an OpenGL context of its own (src/milkdrop/child.rs). These are the
# versions eframe already builds, so they add nothing to compile.
[target.'cfg(windows)'.dependencies.winit]
version = "0.30"
default-features = false

[target.'cfg(windows)'.dependencies.glutin]
version = "0.32"
default-features = false
features = ["wgl", "egl"]

[target.'cfg(windows)'.dependencies.glutin-winit]
version = "0.5"
default-features = false
features = ["wgl", "egl"]

[target.'cfg(target_os = "macos")'.dependencies]
# The system's dialog for choosing files.
rfd = { version = "0.17", default-features = false }
# Where the screens are, for the flyout. These are the versions the tray
# already builds.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSArray", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSScreen", "NSGraphics"] }

[target.'cfg(target_os = "macos")'.dependencies.winit]
version = "0.30"
default-features = false

[target.'cfg(target_os = "macos")'.dependencies.glutin]
version = "0.32"
default-features = false

[target.'cfg(target_os = "macos")'.dependencies.glutin-winit]
version = "0.5"
default-features = false

# X11 is asked for by name (src/main.rs), as Wayland can neither hide a window
# nor place one; Wayland is what a desktop without XWayland gets. The tray is
# a StatusNotifierItem over D-Bus, not GTK. OpenSSL is built in, as
# distributions disagree on libssl's version.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["x11", "wayland"] }
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "rwh_06"] }
glutin = { version = "0.32", default-features = false, features = ["glx", "egl", "x11", "wayland"] }
glutin-winit = { version = "0.5", default-features = false, features = ["glx", "egl", "x11", "wayland"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
native-tls = { version = "0.2", features = ["vendored"] }
# Whether there is a tray, the file manager, and notifications.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# Cuts a skin's window to its shape.
x11rb = { version = "0.13", features = ["shape"] }
# The system's dialog for choosing files, by way of the desktop portal.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

# What Windows offers only through its own interfaces: the buttons on the
# taskbar thumbnail, where the taskbar is, the corners of a window with no
# frame, and its fonts mapped into memory instead of read into it. The audio output already brings the crate in; these are more of
# its features, not more code to trust. Media Foundation and Direct3D 11
# decode a music video's pictures, on the graphics card where it will.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# Decodes a music video's pictures where the system's own decoder is not
# Windows'. Built from Cisco's source.
[target.'cfg(not(windows))'.dependencies]
openh264 = "0.9"

[dev-dependencies]
# Drives the views without a window: finds controls by their accessible
# names and clicks them.
egui_kittest = { version = "0.36", default-features = false }

[build-dependencies]
# Embeds the icon and version details in the Windows executable.
winresource = "0.1"

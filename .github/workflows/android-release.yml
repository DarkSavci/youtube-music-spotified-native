name: Android release

# Pushing a tag like android-v0.5.0-beta.2 builds the phone app, signs it with
# the project's key and publishes it with its checksums: a pre-release when
# the version has a suffix (-beta.2), a release otherwise. Run by hand, it
# builds and keeps the APKs as an artifact only, publishing nothing.
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Chaquopy builds yt-dlp into the app with a Python of the same version.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Version
        id: version
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^android-v', '' } else { '0.0.0-dev' }
          # Each build a higher code than the last, as Android requires of an update.
          $code = 100 + [int]$env:GITHUB_RUN_NUMBER
          "name=$name" >> $env:GITHUB_OUTPUT
          "code=$code" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($name -match '-') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Go core
        shell: pwsh
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          $env:PATH = "$env:PATH;$(go env GOPATH)\bin"
          gomobile init
          ./scripts/build-core-android.ps1

      - name: QuickJS
        shell: pwsh
        run: ./scripts/build-qjs-android.ps1

      # The key never enters the repository: it comes from the repository's
      # secrets, and the files written here are gone with the runner.
      - name: Signing key
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if (-not $env:KEYSTORE_BASE64) { throw 'ANDROID_KEYSTORE_BASE64 is not set' }
          $jks = Join-Path $env:RUNNER_TEMP 'release.jks'
          [IO.File]::WriteAllBytes($jks, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          @(
            "storeFile=$($jks -replace '\\', '/')"
            "storePassword=$env:KEYSTORE_PASSWORD"
            'keyAlias=spotified'
            "keyPassword=$env:KEYSTORE_PASSWORD"
          ) | Set-Content android/keystore.properties

      - name: Build
        shell: pwsh
        working-directory: android
        run: |
          ./gradlew.bat :app:assembleRelease "-PversionName=${{ steps.version.outputs.name }}" "-PversionCode=${{ steps.version.outputs.code }}" --no-daemon
          if ($LASTEXITCODE -ne 0) { throw 'gradle failed' }

      - name: Name the files
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force dist
          $v = '${{ steps.version.outputs.name }}'
          foreach ($abi in 'arm64-v8a', 'x86_64', 'universal') {
            Copy-Item "android/app/build/outputs/apk/release/app-$abi-release.apk" "$out/spotified-$v-$abi.apk"
          }
          Get-ChildItem $out -Filter *.apk | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content "$out/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.version.outputs.name }}
          path: dist/*

      - name: Publish
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pre = if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { '--prerelease' } else { '--latest=false' }
          gh release create $env:GITHUB_REF_NAME $pre --title "Android ${{ steps.version.outputs.name }}" --generate-notes (Get-ChildItem dist).FullName

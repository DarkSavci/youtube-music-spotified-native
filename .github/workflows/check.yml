name: Check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # What the window, the sound and OpenSSL's build need; the last is what
      # the window is run in below.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dri nasm xvfb

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Go tests
        working-directory: core
        run: go test ./...

      # The release build is what ships; a debug build passing says nothing
      # about whether it links.
      - name: Release build
        run: cargo build --release -p spotified

      # Everything above passes with no window at all. This opens one.
      - name: The window opens
        if: runner.os == 'Linux'
        run: |
          sh scripts/build-core.sh
          xvfb-run -a target/release/spotified --demo --screenshot "$RUNNER_TEMP/window.png"
          test -s "$RUNNER_TEMP/window.png"
